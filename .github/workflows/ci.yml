name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/supermarket
      - name: Typecheck API
        run: npm run typecheck
      - name: Run API tests
        run: npm test
      - name: Build API
        run: npm run build
      - name: Typecheck store web
        run: npm run typecheck:store-web
      - name: Build store web
        run: npm run build:store-web
