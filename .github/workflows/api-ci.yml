name: API CI

on:
  push:
    paths:
      - "apps/api/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: supermarket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d supermarket_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/supermarket_test?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Validate Prisma schema
        run: npx prisma validate --schema apps/api/prisma/schema.prisma
      - name: Prepare pre-returns schema for migration test
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const source = readFileSync("apps/api/prisma/schema.prisma", "utf8");
          const lines = source.split("\n");
          const output = [];
          let model = null;
          let skipModel = false;

          for (const line of lines) {
            const start = line.match(/^model (\w+) \{$/);
            if (start) {
              model = start[1];
              skipModel = model === "SaleReturn" || model === "SaleReturnItem";
              if (skipModel) continue;
            }

            if (skipModel) {
              if (line === "}") {
                model = null;
                skipModel = false;
              }
              continue;
            }

            if (/\bSaleReturn(?:Item)?\[\]/.test(line) || /\bSaleReturn\s+@relation/.test(line)) {
              continue;
            }

            // This compound key is introduced by the tenant-scoped return migration.
            if (model === "SaleItem" && line.trim() === "@@unique([storeId, id])") {
              continue;
            }

            output.push(line);
            if (model && line === "}") model = null;
          }

          writeFileSync("apps/api/prisma/schema.pre-returns.prisma", output.join("\n"));
          NODE
      - name: Create base schema in PostgreSQL
        run: npx prisma db push --schema apps/api/prisma/schema.pre-returns.prisma
      - name: Apply sales-return migrations to PostgreSQL
        run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
