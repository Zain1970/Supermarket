name: API CI

on:
  push:
    paths:
      - "apps/api/**"
      - "apps/store-web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Generate Prisma client
        run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build API
        run: npm run build
      - name: Typecheck store web
        run: npm run typecheck:store-web
      - name: Build store web
        run: npm run build:store-web
