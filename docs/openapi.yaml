openapi: 3.1.0
info:
  title: Supermarket Platform API
  version: 0.1.0
  description: |
    عقد API للوظائف المنفذة حاليًا. تحتاج العمليات المحمية إلى جلسة صالحة وعضوية
    متجر مناسبة. يستخدم الإنتاج اسم cookie يبدأ بـ __Host- ويتطلب HTTPS.
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      summary: فحص صحة واجهة API
      operationId: getHealth
      responses:
        "200":
          description: الخادم يعمل
          content:
            application/json:
              schema:
                type: object
                required: [status, service, stage]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: supermarket-api }
                  stage: { type: string, const: foundation }
  /auth/login:
    post:
      summary: تسجيل الدخول
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200": { description: تم تسجيل الدخول وإصدار cookie للجلسة }
        "400": { description: بيانات الإدخال غير صالحة }
        "401": { description: بيانات الدخول غير صحيحة }
        "429": { description: تجاوز حد محاولات تسجيل الدخول }
  /auth/me:
    get:
      summary: عرض الجلسة الحالية
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: هوية المستخدم وعضوياته }
        "401": { description: جلسة غير صالحة }
  /auth/logout:
    post:
      summary: إبطال الجلسة الحالية
      security: [{ sessionCookie: [] }]
      responses:
        "204": { description: تم إبطال الجلسة }
        "401": { description: جلسة غير صالحة }
  /stores/{storeId}/products:
    parameters:
      - in: path
        name: storeId
        required: true
        schema: { type: string }
    get:
      summary: عرض منتجات المتجر
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: q
          schema: { type: string, maxLength: 100 }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200": { description: قائمة المنتجات مع معلومات الصفحات }
        "400": { description: عوامل تصفية غير صالحة }
        "401": { description: يلزم تسجيل الدخول }
        "403": { description: لا توجد عضوية أو صلاحية في المتجر }
    post:
      summary: إنشاء منتج في المتجر
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sku, name, salePrice]
              properties:
                sku: { type: string, minLength: 1, maxLength: 80 }
                barcode: { type: string, maxLength: 100 }
                name: { type: string, minLength: 1, maxLength: 180 }
                description: { type: string, maxLength: 2000 }
                categoryId: { type: string }
                unit: { type: string, default: piece }
                costPrice: { type: string, pattern: '^\\d{1,12}(\\.\\d{1,2})?$' }
                salePrice: { type: string, pattern: '^\\d{1,12}(\\.\\d{1,2})?$' }
                lowStockAt: { type: string, pattern: '^\\d{1,12}(\\.\\d{1,3})?$' }
                allowNegativeStock: { type: boolean, default: false }
      responses:
        "201": { description: تم إنشاء المنتج وتسجيل حدث التدقيق }
        "400": { description: بيانات المنتج غير صالحة }
        "401": { description: يلزم تسجيل الدخول }
        "403": { description: لا توجد صلاحية كتابة }
        "409": { description: الرمز أو الباركود مستخدم }
  /stores/{storeId}/stock-movements:
    parameters:
      - in: path
        name: storeId
        required: true
        schema: { type: string }
    get:
      summary: عرض حركات المخزون
      security: [{ sessionCookie: [] }]
      responses:
        "200": { description: حركات المخزون المسموح بها }
        "401": { description: يلزم تسجيل الدخول }
        "403": { description: لا توجد صلاحية في المتجر }
    post:
      summary: تسجيل تعديل مخزون موثق
      description: يستخدم معاملة Serializable ومفتاح idempotency فريدًا لكل متجر.
      security: [{ sessionCookie: [] }]
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productId, direction, quantity, reason]
              properties:
                productId: { type: string }
                direction: { type: string, enum: [IN, OUT] }
                quantity: { type: string, pattern: '^\\d{1,12}(\\.\\d{1,3})?$' }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "201": { description: تم تسجيل الحركة وتعديل المخزون }
        "200": { description: إعادة آمنة لطلب مطابق سابق }
        "400": { description: بيانات أو مفتاح idempotency غير صالح }
        "401": { description: يلزم تسجيل الدخول }
        "403": { description: لا توجد صلاحية تعديل المخزون }
        "404": { description: المنتج غير موجود في المتجر }
        "409": { description: المخزون غير كافٍ أو المفتاح مستخدم لطلب مختلف }
  /stores/{storeId}/addons:
    get:
      summary: عرض كتالوج الإضافات وحالتها للمتجر
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: storeId
          required: true
          schema: { type: string }
      responses:
        "200": { description: الإضافات المتاحة وحالة التفعيل لكل إضافة }
        "401": { description: يلزم تسجيل الدخول }
        "403": { description: يلزم دور مالك المتجر أو مديره }
  /stores/{storeId}/addons/{addonCode}/purchase:
    post:
      summary: طلب شراء إضافة بالدفع اليدوي
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: storeId
          required: true
          schema: { type: string }
        - in: path
          name: addonCode
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [CASH, BANK_TRANSFER, OTHER] }
                note: { type: string, maxLength: 1000 }
      responses:
        "201": { description: تم تسجيل طلب دفع ينتظر مراجعة المسؤول }
        "200": { description: يوجد طلب دفع معلق سابقًا }
        "401": { description: يلزم تسجيل الدخول }
        "403": { description: يلزم دور مالك المتجر أو مديره }
        "409": { description: الإضافة مفعّلة بالفعل }
  /admin/payments:
    get:
      summary: قائمة المدفوعات لمراجعة مسؤول المنصة
      security: [{ sessionCookie: [] }]
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, CONFIRMED, REJECTED, REFUNDED], default: PENDING }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
      responses:
        "200": { description: قائمة المدفوعات }
        "401": { description: يلزم تسجيل الدخول }
        "403": { description: يلزم مسؤول المنصة }
  /admin/payments/{paymentId}/confirm:
    post:
      summary: تأكيد دفع إضافة وتفعيلها
      security: [{ sessionCookie: [] }]
      parameters:
        - in: path
          name: paymentId
          required: true
          schema: { type: string }
      responses:
        "200": { description: تم تأكيد الدفعة وتفعيل الإضافة }
        "401": { description: يلزم تسجيل الدخول }
        "403": { description: يلزم مسؤول المنصة }
        "409": { description: الدفعة أو طلب التفعيل لم يعد صالحًا }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: supermarket_session
